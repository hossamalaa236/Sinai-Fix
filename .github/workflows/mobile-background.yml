name: Mobile background (fill whole page)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Run update script
        run: |
          python3 - <<'PYEOF'
          import glob
          import re

          from PIL import Image, ImageChops, ImageEnhance, ImageFilter

          MARK = "/* sinai-mobile-v2 */"
          SRC = "sinai-background.jpg"
          OUT = "sinai-background-mobile.jpg"
          BG = (2, 5, 10)

          # ---------- 1) نعمل صورة الموبايل ----------
          W, H = 1080, 2400
          src = Image.open(SRC).convert("RGB")

          # الخلفية: نفس الصورة مكبرة وغير واضحة وغامقة تملا الصفحة كلها
          s = H / src.height
          big = src.resize((int(src.width * s), H), Image.LANCZOS)
          left = (big.width - W) // 2
          fill = big.crop((left, 0, left + W, H)).filter(ImageFilter.GaussianBlur(45))
          fill = ImageEnhance.Brightness(fill).enhance(0.7)

          # فوق الصفحة بيتحول تدريجي للون الخلفية الغامق
          solid = Image.new("RGB", (W, H), BG)
          mask = Image.new("L", (1, H))
          fade_h = int(H * 0.60)
          mask.putdata([max(0, 255 - int(255 * y / fade_h)) if y < fade_h else 0 for y in range(H)])
          fill = Image.composite(solid, fill, mask.resize((W, H)))

          # الصورة الأصلية كاملة بعرض الشاشة تحت
          bh = round(W * src.height / src.width)
          band = ImageEnhance.Brightness(src.resize((W, bh), Image.LANCZOS)).enhance(0.85)
          edge = 90
          m = Image.new("L", (1, bh), 255)
          m.putdata([int(255 * y / edge) if y < edge else 255 for y in range(bh)])
          fill.paste(band, (0, H - bh), m.resize((W, bh)))
          fill.save(OUT, quality=82, optimize=True)
          print("اتعملت صورة الموبايل:", OUT)

          # ---------- 2) CSS ----------
          with open("style.css", "r", encoding="utf-8", errors="surrogateescape", newline="") as f:
              css = f.read()
          if MARK not in css:
              css = css.rstrip() + """

          """ + MARK + """
          @media (max-aspect-ratio: 1/1) {
              html {
                  height: 100%;
              }
              body {
                  box-sizing: border-box;
                  position: relative;
                  min-height: 100%;
                  margin: 0;
                  padding: 8px 8px 48vw 8px;
              }
              .credit {
                  margin-bottom: 0;
              }
              body::before {
                  position: absolute;
                  background-color: #02050a;
                  background-image: url('sinai-background-mobile.jpg');
                  background-size: 100% auto;
                  background-position: center bottom;
              }
          }
          """
              with open("style.css", "w", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  f.write(css)
              print("style.css اتعدل")
          else:
              print("style.css متعدل قبل كده")

          # ---------- 3) ملفات الكاش ----------
          LINE = "../sinai-background-mobile.jpg"
          n = 0
          for p in glob.glob("**/*.manifest", recursive=True):
              with open(p, "r", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  t = f.read()
              if LINE in t:
                  continue
              nl = "\r\n" if "\r\n" in t else "\n"
              out, done = [], False
              for l in t.split(nl):
                  out.append(l)
                  if not done and l.strip() in ("../sinai-background.jpg", "../style.css"):
                      if l.strip() == "../sinai-background.jpg":
                          out.append(LINE)
                          done = True
              if not done:
                  out2 = []
                  for l in out:
                      out2.append(l)
                      if not done and l.strip() == "../style.css":
                          out2.append(LINE)
                          done = True
                  out = out2
              # علامة نسخة جديدة عشان البلايستيشن ينزل الكاش من جديد
              out = [l for l in out if not re.match(r"#\s*v\d+\s*$", l)]
              while out and out[-1].strip() == "":
                  out.pop()
              out.append("# v2")
              with open(p, "w", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  f.write(nl.join(out) + nl)
              n += 1
          print("manifests اتحدثت:", n)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Mobile background fills whole page"
            git push
          fi

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true
