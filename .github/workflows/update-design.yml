name: Update design (background fit + credit line)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run update script
        run: |
          python3 - <<'PYEOF'
          import glob
          import os
          import re
          import time

          MARK = "/* sinai-design */"

          NEW_CSS_TOP = """/* sinai-design */
          html {
              background-color: #02050a;
              color: white;
              text-align: center;
              overflow-x: hidden;
              overflow-y: auto;
          }

          body::before {
              content: "";
              position: fixed;
              top: 0;
              left: 0;
              right: 0;
              bottom: 0;
              z-index: -1;
              background-color: #02050a;
              background-image: linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.42)), url('sinai-background.jpg');
              background-repeat: no-repeat;
              background-position: center center;
              background-size: 100% 100%, contain;
          }

          @media (max-aspect-ratio: 1/1) {
              body::before {
                  background-position: center center, center bottom;
              }
          }

          .credit {
              font-size: 30px;
              margin-top: 40px;
              margin-bottom: 20px;
              padding: 0 10px;
          }

          .credit a {
              color: #f31414;
          }

          @media (max-width: 600px) {
              .credit {
                  font-size: 22px;
                  margin-top: 28px;
              }
          }
          """

          NEW_CREDIT = (
              '<h1 class="credit">Designed by: Hossam_Alaa - '
              '<a href="https://www.facebook.com/Sinaifix" target="_blank">Sinaifix</a></h1>'
          )


          def read(p):
              with open(p, "r", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  return f.read()


          def write(p, t):
              with open(p, "w", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  f.write(t)


          # 1) style.css : الخلفية + شكل الكريدت
          css = read("style.css")
          if MARK not in css:
              css2 = re.sub(r"html\s*\{.*?\}\s*", "", css, count=1, flags=re.S)
              write("style.css", NEW_CSS_TOP + "\n" + css2.lstrip())
              print("style.css اتعدل")
          else:
              print("style.css متعدل قبل كده")

          # 2) index.html : سطر Designed by
          t = read("index.html")
          pat = re.compile(r"<h1[^>]*>\s*Designed by:.*?</h1>", re.S)
          if pat.search(t):
              write("index.html", pat.sub(lambda m: NEW_CREDIT, t, count=1))
              print("سطر Designed by اتعدل")
          else:
              print("مش لاقي سطر Designed by في index.html")

          # 3) manifests : تغيير بسيط عشان البلايستيشن ينزل الكاش من جديد
          stamp = "# v" + os.environ.get("GITHUB_RUN_NUMBER", str(int(time.time())))
          n = 0
          for p in glob.glob("**/*.manifest", recursive=True):
              m = read(p)
              nl = "\r\n" if "\r\n" in m else "\n"
              lines = [l for l in m.split(nl) if not re.match(r"#\s*v\d+\s*$", l)]
              while lines and lines[-1].strip() == "":
                  lines.pop()
              lines.append(stamp)
              write(p, nl.join(lines) + nl)
              n += 1
          print("manifests اتحدثت:", n)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update design: fit background and credit line"
            git push
          fi

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true
