name: Fix offline background (add image to cache manifests)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run fix script
        run: |
          python3 - <<'PYEOF'
          import glob, os

          LINE = "../sinai-background.jpg"
          n = 0
          for p in glob.glob("**/*.manifest", recursive=True):
              with open(p, "r", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  t = f.read()
              if LINE in t:
                  continue
              nl = "\r\n" if "\r\n" in t else "\n"
              lines = t.split(nl)
              out, done = [], False
              for l in lines:
                  out.append(l)
                  if not done and l.strip() == "../style.css":
                      out.append(LINE)
                      done = True
              if not done:
                  print("مفيش style.css في:", p)
                  continue
              with open(p, "w", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  f.write(nl.join(out))
              print("تم التعديل:", p)
              n += 1
          print("خلص. عدد الملفات:", n)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Cache background image in manifests"
            git push
          fi

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true
