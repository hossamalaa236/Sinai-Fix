name: Special Thanks on inner pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run script
        run: |
          python3 - <<'PYEOF'
          import glob
          import os
          import re

          MARK = "<!-- sinai-thanks -->"

          BLOCK = (
              MARK
              + "<style>"
              ".sinai-thanks{position:fixed;left:0;right:0;bottom:1.5%;margin:0;padding:0 10px;"
              "z-index:9998;text-align:center;font-family:'Times New Roman',serif;font-weight:bold;"
              "font-size:32px;line-height:1.1;color:#fff;pointer-events:none;"
              "text-shadow:0 0 6px #000,0 0 12px #000;}"
              ".sinai-thanks span{color:#ff3b3b;}"
              "@media (max-width:700px){.sinai-thanks{font-size:22px;}}"
              "@media (max-width:400px){.sinai-thanks{font-size:19px;}}"
              "@media (max-height:560px){.sinai-thanks{font-size:16px;}}"
              "</style>"
              '<div class="sinai-thanks">Special Thanks to: <span>Hossam Alaa</span></div>'
          )


          def read(p):
              with open(p, "r", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  return f.read()


          def write(p, t):
              with open(p, "w", encoding="utf-8", errors="surrogateescape", newline="") as f:
                  f.write(t)


          added = 0
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]
              for name in files:
                  if not name.lower().endswith(".html"):
                      continue
                  path = os.path.normpath(os.path.join(root, name))
                  if path == "index.html":  # الصفحة الرئيسية لا
                      continue
                  text = read(path)
                  # نمسح أي سطر Special Thanks القديم (مش بتاعنا)
                  lines = text.splitlines(True)
                  kept = [l for l in lines if not ("Special Thanks to:" in l and "sinai-thanks" not in l)]
                  text = "".join(kept)
                  if MARK not in text:
                      m = re.search(r"<body[^>]*>", text, re.I)
                      if not m:
                          write(path, text)
                          continue
                      text = text[: m.end()] + BLOCK + text[m.end():]
                      added += 1
                      print("اتضاف:", path)
                  write(path, text)

          print("عدد الصفحات:", added)

          # علامة نسخة جديدة في ملفات الكاش
          n = 0
          for p in glob.glob("**/*.manifest", recursive=True):
              m = read(p)
              nl = "\r\n" if "\r\n" in m else "\n"
              lines = [l for l in m.split(nl) if not re.match(r"#\s*v\d+\s*$", l)]
              while lines and lines[-1].strip() == "":
                  lines.pop()
              lines.append("# v4")
              write(p, nl.join(lines) + nl)
              n += 1
          print("manifests اتحدثت:", n)
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Special Thanks line to inner pages"
            git push
          fi

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds" || true
